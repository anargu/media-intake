services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://media_intake:media_intake_dev@db:5432/media_intake?sslmode=disable
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: media_intake
      POSTGRES_USER: media_intake
      POSTGRES_PASSWORD: media_intake_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_intake -d media_intake"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
